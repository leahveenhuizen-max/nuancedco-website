<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're on the waitlist | Nuanced Co.</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root{--cream:#F6F1E9;--ink:#2A1F1A;--ink-deep:#0F0C0A;--gold:#C4963E;--purple:#6B4570;--sage:#7A8C6E;--serif:'Cormorant Garamond',Georgia,serif;--body:'Atkinson Hyperlegible',system-ui,sans-serif;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{font-size:18px;}
    body{background:var(--ink);color:var(--cream);font-family:var(--body);line-height:1.7;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 2rem;text-align:center;}
    a{color:inherit;text-decoration:none;}
    .logo{font-family:var(--serif);font-size:.95rem;font-weight:400;letter-spacing:.25em;text-transform:uppercase;color:var(--cream);display:flex;flex-direction:column;gap:3px;align-items:center;margin-bottom:3rem;}
    .logo em{font-style:normal;font-family:var(--body);font-size:.44rem;letter-spacing:.3em;color:var(--gold);opacity:.8;}
    .rule{width:32px;height:1px;background:var(--gold);opacity:.5;margin:1.6rem auto;}
    h1{font-family:var(--serif);font-size:clamp(2rem,5vw,3.2rem);font-weight:300;color:var(--cream);line-height:1.1;margin-bottom:.8rem;}
    p{font-size:.88rem;color:rgba(246,241,233,.6);line-height:1.8;max-width:480px;margin:0 auto .8rem;}
    .back{display:inline-flex;align-items:center;gap:.5rem;margin-top:2rem;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,241,233,.4);border:1px solid rgba(246,241,233,.12);padding:.6rem 1.2rem;border-radius:2px;transition:color .2s,border-color .2s;}
    .back:hover{color:var(--cream);border-color:rgba(246,241,233,.3);}
    .back svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5;}
  </style>
</head>
<body>
  <a href="index.html" class="logo">NUANCED CO.<em>Neurodivergent Consultancy</em></a>
  <h1>You're on the waitlist.</h1>
  <div class="rule" aria-hidden="true"></div>
  <p>I'll send course updates and early access details when enrolment opens.</p>
  <p>In the meantime, feel free to explore the site or reach out if you have any questions.</p>
  <a href="index.html" class="back">
    <svg viewBox="0 0 16 16"><path d="M10 12L6 8l4-4"/></svg>
    Back to The Unmasked Life
  </a>
</body>
</html>
