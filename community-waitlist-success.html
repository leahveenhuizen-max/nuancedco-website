<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're on the list | Nuanced Co.</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root{--cream:#F6F1E9;--ink-deep:#0F0C0A;--gold:#C4963E;--sage:#7A8C6E;--lilac:#9668A4;--serif:'Cormorant Garamond',Georgia,serif;--body:'Atkinson Hyperlegible',system-ui,sans-serif;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{font-size:18px;}
    body{background:var(--ink-deep);color:var(--cream);font-family:var(--body);line-height:1.7;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 2rem;text-align:center;}
    a{color:inherit;text-decoration:none;}
    .logo{font-family:var(--serif);font-size:.9rem;font-weight:400;letter-spacing:.26em;text-transform:uppercase;color:var(--cream);display:flex;flex-direction:column;gap:3px;align-items:center;margin-bottom:3rem;}
    .logo em{font-style:normal;font-family:var(--body);font-size:.44rem;letter-spacing:.3em;color:var(--gold);opacity:.8;}
    h1{font-family:var(--serif);font-size:clamp(2rem,5vw,3.2rem);font-weight:300;line-height:1.1;margin-bottom:.6rem;}
    .rule{width:32px;height:1px;background:var(--sage);opacity:.4;margin:1.4rem auto;}
    p{font-size:.88rem;color:rgba(246,241,233,.6);line-height:1.8;max-width:460px;margin:0 auto .6rem;}
    .back{display:inline-flex;align-items:center;gap:.5rem;margin-top:2rem;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,241,233,.4);border:1px solid rgba(246,241,233,.12);padding:.6rem 1.4rem;border-radius:2px;transition:color .1s cubic-bezier(0.22,1,0.36,1),border-color .1s cubic-bezier(0.22,1,0.36,1);}
    .back:hover{color:var(--cream);border-color:rgba(246,241,233,.3);}
    .back svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5;}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.rv,.rvl,.rvr,.ncrv{opacity:1!important;transform:none!important}}
</style>
</head>
<body>
  <a href="index.html" class="logo">NUANCED CO.<em>Neurodivergent Consultancy</em></a>
  <h1>You're on the list.</h1>
  <div class="rule" aria-hidden="true"></div>
  <p>Thank you for joining. I'll send updates about future Nuanced Co. resources, group programs and community spaces.</p>
  <a href="index.html" class="back">
    <svg viewBox="0 0 16 16"><path d="M10 12L6 8l4-4"/></svg>
    Back to Nuanced Co.
  </a>
<footer style="background:#1A1A1A;padding:1.5rem 2rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem;border-top:1px solid rgba(246,241,233,.08);">
  <p style="font-size:.68rem;color:rgba(246,241,233,.4);margin:0;">&copy; 2026 Nuanced Co. All rights reserved.</p>
  <div style="display:flex;gap:1.2rem;flex-wrap:wrap;">
    <a href="index.html" style="font-size:.68rem;color:rgba(246,241,233,.45);text-decoration:none;">Home</a>
    <a href="privacy.html" style="font-size:.68rem;color:rgba(246,241,233,.45);text-decoration:none;">Privacy Policy</a>
    <a href="terms-of-service.html" style="font-size:.68rem;color:rgba(246,241,233,.45);text-decoration:none;">Terms of Service</a>
  </div>
</footer>
<script>
(function(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches||!('IntersectionObserver' in window))return;
  var s=document.createElement('style');
  s.textContent='.ncrv{opacity:0;transform:translateY(20px);transition:opacity .8s cubic-bezier(0.22,1,0.36,1),transform .8s cubic-bezier(0.22,1,0.36,1)}.ncrv.in{opacity:1;transform:none}';
  document.head.appendChild(s);
  var els=[];
  function addGroup(grid){if(grid.dataset.ncrv)return;grid.dataset.ncrv='1';Array.prototype.forEach.call(grid.children,function(c,i){c.classList.add('ncrv');c.style.transitionDelay=((i%8)*0.15)+'s';els.push(c);});}
  document.querySelectorAll('section,.card').forEach(function(sec){
    if(sec.closest('nav'))return;
    var grid=sec.querySelector('[class*="grid"],[class*="cards"]');
    if(grid&&grid.children.length>1&&grid.children.length<13){addGroup(grid);}
    sec.classList.add('ncrv');els.push(sec);
  });
  document.querySelectorAll('.sprint-grid').forEach(addGroup);
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});
  },{threshold:0.1,rootMargin:'0px 0px -40px 0px'});
  els.forEach(function(el){io.observe(el);});
})();
</script>
</body>
</html>
