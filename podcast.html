<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podcast | Nuanced Co. | Neurodivergent Consultancy</title>
  <meta name="description" content="A podcast from Nuanced Co. — coming soon. Honest conversations about ADHD, late diagnosis, and building a life that fits your actual brain.">
  <link rel="canonical" href="https://nuancedco.com.au/podcast">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream:#F6F1E9;--cream-d:#EDE6D8;--ink:#2A1F1A;--ink-mid:#4A3830;--ink-deep:#0F0C0A;
      --purple:#6B4570;--gold:#C4963E;--rose:#C07A8A;--lilac:#9668A4;
      --serif:'Cormorant Garamond',Georgia,serif;
      --body:'Atkinson Hyperlegible',system-ui,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{font-size:18px;}
    body{background:var(--ink-deep);color:var(--cream);font-family:var(--body);line-height:1.7;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;}
    a{color:inherit;text-decoration:none;}
    :focus-visible{outline:2px solid var(--lilac);outline-offset:3px;border-radius:3px;}

    .coming-wrap{text-align:center;padding:4rem 2rem;max-width:580px;}
    .logo-link{font-family:var(--serif);font-size:.9rem;font-weight:400;letter-spacing:.28em;color:rgba(246,241,233,.5);text-transform:uppercase;display:block;margin-bottom:4rem;}
    .coming-icon{font-size:2.8rem;margin-bottom:2rem;opacity:.6;}
    .coming-eyebrow{font-size:.52rem;letter-spacing:.28em;text-transform:uppercase;color:var(--lilac);margin-bottom:1rem;}
    .coming-title{font-family:var(--serif);font-size:clamp(2.4rem,5vw,3.8rem);font-weight:300;line-height:1.05;color:#fff;letter-spacing:.03em;margin-bottom:1.4rem;}
    .coming-title em{font-style:italic;color:var(--rose);}
    .coming-desc{font-size:.92rem;color:rgba(246,241,233,.65);line-height:1.8;margin-bottom:2.5rem;}
    .coming-form{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-bottom:1.4rem;}
    .coming-form input{flex:1;min-width:220px;padding:.75rem 1rem;background:rgba(246,241,233,.06);border:1px solid rgba(246,241,233,.15);color:var(--cream);font-family:var(--body);font-size:.85rem;border-radius:2px;outline:none;}
    .coming-form input::placeholder{color:rgba(246,241,233,.35);}
    .coming-form input:focus{border-color:var(--lilac);}
    .coming-form button{padding:.75rem 1.6rem;background:var(--purple);color:#fff;font-family:var(--body);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;border:none;border-radius:40px;cursor:pointer;transition:background .2s;}
    .coming-form button:hover{background:var(--lilac);}
    .coming-note{font-size:.68rem;color:rgba(246,241,233,.35);line-height:1.6;}
    .back-link{display:inline-flex;align-items:center;gap:.4rem;margin-top:3rem;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(246,241,233,.4);transition:color .2s;}
    .back-link:hover{color:rgba(246,241,233,.75);}
  </style>
</head>
<body>

<div class="coming-wrap">
  <a href="index.html" class="logo-link">Nuanced Co.</a>

  <div class="coming-icon">&#127897;</div>
  <p class="coming-eyebrow">Coming soon</p>
  <h1 class="coming-title">The Nuanced Co.<br><em>Podcast</em></h1>
  <p class="coming-desc">Honest conversations about ADHD, late diagnosis, masking, grief, and building a life that actually fits your brain. No scripts. No toxic positivity. Just real talk.</p>

  <form name="podcast-notify" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="javascript:void(0)" onsubmit="handleSubmit(this)">
    <input type="hidden" name="form-name" value="podcast-notify">
    <p style="display:none;"><label>Do not fill: <input name="bot-field"></label></p>
    <div class="coming-form">
      <input type="email" name="email" placeholder="your@email.com" required aria-label="Email address">
      <button type="submit">Notify me</button>
    </div>
  </form>

  <p class="coming-note" id="podcast-msg">Sign up to be notified when the first episode drops.</p>

  <a href="index.html" class="back-link">&#8592; Back to Nuanced Co.</a>
</div>

<script>
function handleSubmit(form){
  fetch('/', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams(new FormData(form)).toString()})
    .then(()=>{ document.getElementById('podcast-msg').textContent = "You're on the list. We'll let you know when the first episode is ready."; form.reset(); })
    .catch(()=>{ document.getElementById('podcast-msg').textContent = "Something went wrong. Please email hello@nuancedco.com.au to be added to the list."; });
}
</script>
</body>
</html>
